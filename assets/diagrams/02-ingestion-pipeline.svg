r</text><text x="88" y="317" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">No real health outcomes</text><rect x="65" y="410" width="236" height="108" rx="17" fill="#153345" stroke="#70d6fe" stroke-width="2.5" filter="url(#shade)"/><rect x="65" y="410" width="7" height="108" rx="3" fill="#70d6fe"/><text x="88" y="446" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">WHO GHO</text><text x="88" y="475" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Optional OData pull</text><text x="88" y="497" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Approved-host paging</text><rect x="361" y="322" width="236" height="108" rx="17" fill="#153345" stroke="#78e8cb" stroke-width="2.5" filter="url(#shade)"/><rect x="361" y="322" width="7" height="108" rx="3" fill="#78e8cb"/><text x="384" y="358" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Data cleaning</text><text x="384" y="387" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Normalize fields</text><text x="384" y="409" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Country / time / unit</text><rect x="656" y="322" width="236" height="108" rx="17" fill="#153345" stroke="#f4bf70" stroke-width="2.5" filter="url(#shade)"/><rect x="656" y="322" width="7" height="108" rx="3" fill="#f4bf70"/><text x="679" y="358" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Validation</text><text x="679" y="387" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Range checks</text><text x="679" y="409" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Uniqueness &amp; source</text><rect x="952" y="322" width="236" height="108" rx="17" fill="#153345" stroke="#78e8cb" stroke-width="2.5" filter="url(#shade)"/><rect x="952" y="322" width="7" height="108" rx="3" fill="#78e8cb"/><text x="975" y="358" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="