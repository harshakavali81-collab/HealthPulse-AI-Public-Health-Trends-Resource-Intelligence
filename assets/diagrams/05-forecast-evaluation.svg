<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Forecast evaluation"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08182a"/><stop offset="1" stop-color="#112d3b"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".25"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#64dcca"/></marker></defs><rect width="1280" height="720" rx="24" fill="url(#bg)"/><rect x="28" y="24" width="1224" height="672" rx="24" fill="none" stroke="#254252"/><text x="70" y="100" fill="#f0fbff" font-size="43" font-family="Arial,sans-serif" font-weight="700">Forecast evaluation</text><text x="70" y="142" fill="#9ebfca" font-size="21" font-family="Arial,sans-serif">Simple time-based trend baseline — not epidemiological prediction</text><path d="M310 330H348" fill="none" stroke="#64dcca" stroke-width="4" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><path d="M610 330H648" fill="none" stroke="#64dcca" stroke-width="4" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><path d="M910 330H948" fill="none" stroke="#64dcca" stroke-width="4" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><rect x="60" y="275" width="250" height="108" rx="17" fill="#153345" stroke="#70d6fe" stroke-width="2.5" filter="url(#shade)"/><rect x="60" y="275" width="7" height="108" rx="3" fill="#70d6fe"/><text x="83" y="311" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Annual series</text><text x="83" y="340" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">One country + indicator</text><text x="83" y="362" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">At least 6 time points</text><rect x="360" y="275" width="250" height="108" rx="17" fill="#153345" stroke="#79ecc8" stroke-width="2.5" filter="url(#shade)"/><rect x="360" y="275" width="7" height="108" rx="3" fill="#79ecc8"/><text x="383" y="311" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Chronological split</text><text x="383" y="340" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Last 20% held out</text><text x="383" y="362" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Minimum 2 test years</text><rect x="660" y="275" width="250" height="108" rx="17" fill="#153345" stroke="#ffc67c" stroke-width="2.5" filter="url(#shade)"/><rect x="660" y="275" width="7" height="108" rx="3" fill="#ffc67c"/><text x="683" y="311" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Ridge vs naive</text><text x="683" y="340" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">MAE on held-out years</text><text x="683" y="362" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Last-value baseline</text><rect x="960" y="275" width="250" height="108" rx="17" fill="#153345" stroke="#c7a6ff" stroke-width="2.5" filter="url(#shade)"/><rect x="960" y="275" width="7" height="108" rx="3" fill="#c7a6ff"/><text x="983" y="311" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Forecast view</text><text x="983" y="340" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Refit + 1–5 years</text><text x="983" y="362" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Clamp indicator bounds</text><line x1="70" y1="638" x2="1210" y2="638" stroke="#2e5868"/><text x="70" y="665" fill="#94b4bf" font-size="17" font-family="Arial,sans-serif">Illustrative projections only. No causal inference, clinical use or calibrated uncertainty.</text><text x="1200" y="665" text-anchor="end" fill="#54d9bd" font-size="15" font-family="Arial,sans-serif">HEALTHPULSE AI · REFERENCE DIAGRAM</text></svg>