h="7" height="108" rx="3" fill="#e5b16b"/><text x="395" y="481" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">POST /admin/sync</text><text x="395" y="510" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Private X-Admin-Key</text><text x="395" y="532" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Optional WHO import</text><rect x="678" y="445" width="248" height="108" rx="17" fill="#153345" stroke="#79ecc8" stroke-width="2.5" filter="url(#shade)"/><rect x="678" y="445" width="7" height="108" rx="3" fill="#79ecc8"/><text x="701" y="481" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Validation gate</text><text x="701" y="510" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Bounds, host, schema</text><text x="701" y="532" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Source-tagged upsert</text><line x1="70" y1="638" x2="1210" y2="638" stroke="#2e5868"/><text x="70" y="665" fill="#94b4bf" font-size="17" font-family="Arial,sans-serif">Public read endpoints never trigger WHO writes. Sync fails closed without an admin key.</text><text x="1200" y="665" text-anchor="end" fill="#54d9bd" font-size="15" font-family="Arial,sans-serif">HEALTHPULSE AI · REFERENCE DIAGRAM</text></svg>