<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Data model"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08182a"/><stop offset="1" stop-color="#112d3b"/></linearGradient><filter id="shade"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".25"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#64dcca"/></marker></defs><rect width="1280" height="720" rx="24" fill="url(#bg)"/><rect x="28" y="24" width="1224" height="672" rx="24" fill="none" stroke="#254252"/><text x="70" y="100" fill="#f0fbff" font-size="43" font-family="Arial,sans-serif" font-weight="700">Data model</text><text x="70" y="142" fill="#9ebfca" font-size="21" font-family="Arial,sans-serif">Source-aware, de-duplicated annual country-level observations</text><path d="M590 288H713" fill="none" stroke="#64dcca" stroke-width="4" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><path d="M590 480H713" fill="none" stroke="#64dcca" stroke-width="4" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round" opacity=".94"/><rect x="70" y="215" width="520" height="319" rx="17" fill="#153345" stroke="#79ecc8" stroke-width="2.5" filter="url(#shade)"/><rect x="70" y="215" width="7" height="319" rx="3" fill="#79ecc8"/><text x="93" y="251" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">observations · SQLite</text><text x="93" y="280" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">id              INTEGER PRIMARY KEY</text><text x="93" y="302" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">indicator       TEXT · country TEXT</text><text x="93" y="324" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">country_name    TEXT · region TEXT</text><text x="93" y="346" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">year            INTEGER · value REAL</text><text x="93" y="368" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">unit            TEXT · source TEXT</text><text x="93" y="390" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">source_url      TEXT · note TEXT</text><text x="93" y="412" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">ingested_at     TEXT timestamp</text><text x="93" y="434" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">UNIQUE(indicator, country, year, source)</text><rect x="725" y="215" width="477" height="145" rx="17" fill="#153345" stroke="#70d6fe" stroke-width="2.5" filter="url(#shade)"/><rect x="725" y="215" width="7" height="145" rx="3" fill="#70d6fe"/><text x="748" y="251" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Indicator definitions</text><text x="748" y="280" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Configured in healthpulse.processing</text><text x="748" y="302" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Unit, bounds and optional WHO code</text><rect x="725" y="419" width="477" height="145" rx="17" fill="#153345" stroke="#ffc67c" stroke-width="2.5" filter="url(#shade)"/><rect x="725" y="419" width="7" height="145" rx="3" fill="#ffc67c"/><text x="748" y="455" fill="#f7fcfe" font-size="23" font-family="Arial,sans-serif" font-weight="700">Provenance &amp; safeguards</text><text x="748" y="484" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Source = synthetic OR WHO</text><text x="748" y="506" fill="#b2d0d7" font-size="16" font-family="Arial,sans-serif">Validation precedes insert / upsert</text><line x1="70" y1="638" x2="1210" y2="638" stroke="#2e5868"/><text x="70" y="665" fill="#94b4bf" font-size="17" font-family="Arial,sans-serif">Indicator metadata is a Python configuration, not a second SQL table.</text><text x="1200" y="665" text-anchor="end" fill="#54d9bd" font-size="15" font-family="Arial,sans-serif">HEALTHPULSE AI · REFERENCE DIAGRAM</text></svg>