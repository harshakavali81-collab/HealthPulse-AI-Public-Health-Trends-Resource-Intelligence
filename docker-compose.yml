services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HEALTHPULSE_DB: /app/data/healthpulse.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - healthpulse_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  dashboard:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  healthpulse_data:
