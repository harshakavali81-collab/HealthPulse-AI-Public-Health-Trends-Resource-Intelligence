name: WHO live connectivity probe (manual only)
on:
  workflow_dispatch:
    inputs:
      indicator:
        description: WHO GHO indicator to probe
        required: true
        type: choice
        options:
          - life_expectancy
          - immunization
          - under5_mortality
      country:
        description: ISO3 country code for a bounded probe
        required: true
        default: IND
        type: choice
        options: [IND, USA, BRA, ZAF, NGA]
permissions:
  contents: read
jobs:
  live-who-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Query WHO (no database modification)
        env:
          WHO_INDICATOR: ${{ inputs.indicator }}
          WHO_COUNTRY: ${{ inputs.country }}
        run: PYTHONPATH=src:. python -m scripts.who_probe --indicator "$WHO_INDICATOR" --country "$WHO_COUNTRY"
